[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tejtex"
dynamic = ["version"]
description = "Compile LaTeX into native, structurally editable Word (DOCX) documents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-docx==1.2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tejtex = "tejtex.cli:main"

[tool.setuptools.dynamic]
version = {attr = "tejtex.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
