name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      TEJTEX_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pandoc 3.9 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - name: Install pandoc 3.9 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-windows-x86_64.zip -OutFile pandoc.zip
          Expand-Archive pandoc.zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\pandoc-3.9" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install tejtex
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Smoke test
        run: |
          pandoc --version | head -1
          tejtex --version
          cd examples
          tejtex compile main.tex
          test -f main.docx
          code=0
          tejtex compile missing.tex || code=$?
          test "$code" -eq 3

      - name: Tests
        run: python -m pytest -v -rs
